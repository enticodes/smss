

import { useState } from "react";

function App() {
  const [name, setName] = useState("");

  return (
    <div>
      <h1>Student Management System</h1>

      <input
        type="text"
        placeholder="Enter student name"
        value={name}
        onChange={(event) => setName(event.target.value)}
      />

      <p>Student name: {name}</p>
    </div>
  );
}

export default App;
